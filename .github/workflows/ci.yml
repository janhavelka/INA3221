name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-6.1.19-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"

      - name: Build ${{ matrix.environment }}
        run: python -m platformio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-6.1.19-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Run native tests
        run: python -m platformio test -e native

      - name: Enforce strict host warnings
        run: python tools/check_strict_compile.py

  validate-library:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install "platformio==6.1.19"

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Check generated version metadata
        run: python scripts/generate_version.py check

      - name: Check release metadata parity
        run: python tools/check_metadata_consistency.py

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Build warning-clean API documentation
        run: doxygen Doxyfile

      - name: Validate library package
        run: python -m platformio pkg pack

  esp-idf-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select ESP32-S3 with ESP-IDF 6.0.1
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/project" -w /project
          espressif/idf:v6.0.1
          idf.py -C examples/esp_idf/basic set-target esp32s3

      - name: Build ESP32-S3 ESP-IDF example
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/project" -w /project
          espressif/idf:v6.0.1
          idf.py -C examples/esp_idf/basic build

      - name: Select ESP32-S2 with ESP-IDF 6.0.1
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/project" -w /project
          espressif/idf:v6.0.1
          idf.py -C examples/esp_idf/basic set-target esp32s2

      - name: Build ESP32-S2 ESP-IDF example
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/project" -w /project
          espressif/idf:v6.0.1
          idf.py -C examples/esp_idf/basic build
